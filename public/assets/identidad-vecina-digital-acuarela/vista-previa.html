<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identidad ilustrada · Vecina Digital</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1e9dd; color: #332820; font-family: Arial, sans-serif; }
    main { max-width: 1100px; padding: 48px 24px 80px; margin: auto; }
    h1, h2 { font-family: Georgia, serif; }
    h1 { font-size: clamp(2rem, 5vw, 3.4rem); margin: 0 0 10px; }
    p { color: #675a4c; line-height: 1.5; margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 20px; }
    article { display: flex; flex-direction: column; align-items: center; border: 1px solid #d9ccbb; border-radius: 20px; background: #f9f5ee; padding: 24px; box-shadow: 0 10px 24px #60422712; }
    img { display: block; max-width: 100%; width: 100%; height: 380px; object-fit: contain; }
    h2 { font-size: 1.3rem; margin: 20px 0 0; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Vecina Digital, en acuarela</h1>
    <p>Casa, puerta y logo con el mismo estilo de las ilustraciones de servicios.</p>
    <div class="grid">
      <article><img src="casa-acuarela.webp" alt="Casa de piedra con puerta de corazón y plantas"><h2>La casa</h2></article>
      <article><img src="puerta-acuarela.webp" alt="Puerta arqueada de piedra con corazón, farol y macetas"><h2>La puerta</h2></article>
      <article><img src="logo-vecina-digital-acuarela.webp" alt="Logo Vecina Digital con puerta ilustrada"><h2>El logo</h2></article>
    </div>
  </main>
</body>
</html>
